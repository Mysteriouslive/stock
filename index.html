<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        body {
            background: #030303;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        }
        
        .glass {
            background: rgba(12, 12, 14, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .stock-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stock-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .stock-btn.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.18), rgba(139, 92, 246, 0.1));
            border-left: 3px solid #3b82f6;
            color: #fff;
        }
        
        .price-up { color: #ef4444; }
        .price-down { color: #10b981; }
        
        .loading-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .stock-btn:hover .delete-btn {
            opacity: 1;
        }
        
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                height: 100%;
                z-index: 50;
                transition: left 0.3s ease;
            }
            #sidebar.open { left: 0; }
            #overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 40;
            }
            #overlay.show { display: block; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex">

    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- 左側邊欄 -->
    <aside id="sidebar" class="w-72 glass flex flex-col shrink-0 border-r border-white/5 z-20">
        <div class="p-5 border-b border-white/5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
                        自選股清單
                    </h1>
                    <p class="text-[11px] text-gray-500 mt-0.5">Personal Watchlist</p>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="flex gap-2">
                <input 
                    id="stock-input" 
                    type="text" 
                    placeholder="輸入代碼 (例: AAPL)" 
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/30"
                    onkeydown="if(event.key==='Enter') addStock()"
                    maxlength="12"
                >
                <button 
                    onclick="addStock()" 
                    class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-sm font-medium transition-colors shrink-0"
                >
                    新增
                </button>
            </div>
            <p class="text-[10px] text-gray-600 mt-2">支援美股代碼，例如 TSLA、GOOGL、MSFT</p>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="stock-list"></div>

        <div class="p-4 border-t border-white/5 text-[11px] text-gray-500">
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                報價 Finnhub · K線 Yahoo (Worker)
            </div>
        </div>
    </aside>

    <!-- 右側主內容 -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>
        <div class="absolute bottom-[-15%] left-[-5%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="md:hidden flex items-center gap-3 p-4 border-b border-white/5">
            <button onclick="toggleSidebar()" class="p-2 rounded-lg glass text-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="font-semibold tracking-wide">股票觀測站</span>
        </div>

        <div class="flex-1 flex flex-col p-4 md:p-6 overflow-y-auto relative z-10">
            <header class="glass rounded-2xl p-5 md:p-6 mb-5 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-blue-500 via-purple-500 to-transparent opacity-60"></div>
                
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="stock-symbol-title" class="text-3xl md:text-4xl font-black tracking-wider text-white">—</h2>
                            <span id="loading-badge" class="hidden text-[11px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 loading-pulse">
                                載入中
                            </span>
                        </div>
                        <p id="stock-name" class="text-gray-400 text-sm mt-1">選擇或新增股票以查看詳情</p>
                        <p id="last-update" class="text-[11px] text-gray-600 mt-2">—</p>
                    </div>

                    <div class="text-left md:text-right">
                        <p class="text-xs text-gray-500 mb-1 tracking-wide">最新成交價</p>
                        <div class="flex items-baseline gap-3 md:justify-end">
                            <span id="current-price" class="text-4xl md:text-5xl font-extrabold text-white tracking-tight">—</span>
                            <span id="price-change" class="text-base md:text-lg font-semibold px-2.5 py-1 rounded-lg bg-white/5">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="flex-1 glass rounded-2xl p-3 md:p-4 min-h-[380px] relative">
                <div id="chart-container" class="w-full h-full min-h-[360px]"></div>
                
                <div id="empty-state" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="text-center text-gray-500">
                        <div class="text-4xl mb-3 opacity-30">📈</div>
                        <p class="text-sm">選擇或新增股票開始觀測</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚠️ 請在此填入你的 Finnhub API Key（只用於報價）
        // ==========================================
        const FINNHUB_API_KEY = 'da3fmchr01qual4pud1gda3fmchr01qual4pud20';

        // Cloudflare Worker 網址（已幫你填好）
        const WORKER_URL = 'https://stock-proxy.stu-108042.workers.dev';

        const DEFAULT_STOCKS = [
            { symbol: 'AMD', name: '超微', color: 'orange' },
            { symbol: 'META', name: 'Meta', color: 'blue' },
            { symbol: 'NVDA', name: '輝達', color: 'green' },
            { symbol: 'TSM', name: '台積電 ADR', color: 'cyan' }
        ];

        const COLOR_MAP = {
            orange: 'bg-orange-500/20 text-orange-400',
            blue: 'bg-blue-500/20 text-blue-400',
            green: 'bg-green-500/20 text-green-400',
            cyan: 'bg-cyan-500/20 text-cyan-400',
            purple: 'bg-purple-500/20 text-purple-400',
            pink: 'bg-pink-500/20 text-pink-400',
            yellow: 'bg-yellow-500/20 text-yellow-400',
            red: 'bg-red-500/20 text-red-400',
            indigo: 'bg-indigo-500/20 text-indigo-400',
            teal: 'bg-teal-500/20 text-teal-400'
        };
        const COLOR_KEYS = Object.keys(COLOR_MAP);

        let watchlist = JSON.parse(localStorage.getItem('stockWatchlist')) || [...DEFAULT_STOCKS];

        // 初始化圖表
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                textColor: '#9ca3af',
                background: { type: 'solid', color: 'transparent' },
                fontSize: 12
            },
            grid: {
                vertLines: { color: 'rgba(255,255,255,0.04)' },
                horzLines: { color: 'rgba(255,255,255,0.04)' }
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: 'rgba(255,255,255,0.2)', width: 1, style: 2 },
                horzLine: { color: 'rgba(255,255,255,0.2)', width: 1, style: 2 }
            },
            timeScale: {
                borderColor: 'rgba(255,255,255,0.08)',
                timeVisible: true
            },
            rightPriceScale: {
                borderColor: 'rgba(255,255,255,0.08)'
            }
        });

        const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#ef4444',
            downColor: '#10b981',
            borderVisible: false,
            wickUpColor: '#ef4444',
            wickDownColor: '#10b981'
        });

        const resizeObserver = new ResizeObserver(() => {
            chart.applyOptions({
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight
            });
        });
        resizeObserver.observe(chartContainer);

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function saveWatchlist() {
            localStorage.setItem('stockWatchlist', JSON.stringify(watchlist));
        }

        function renderWatchlist() {
            const listEl = document.getElementById('stock-list');
            listEl.innerHTML = '';

            if (watchlist.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-600 text-sm py-8">尚未新增任何股票</p>`;
                return;
            }

            watchlist.forEach((stock, index) => {
                const colorClass = COLOR_MAP[stock.color] || COLOR_MAP.blue;
                const btn = document.createElement('button');
                btn.className = `stock-btn w-full text-left px-3 py-2.5 rounded-xl text-gray-400 flex items-center gap-3 group`;
                btn.dataset.symbol = stock.symbol;
                btn.onclick = () => loadStock(stock.symbol);

                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg ${colorClass} flex items-center justify-center text-xs font-bold shrink-0">
                        ${stock.symbol.slice(0, 4)}
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-sm truncate">${stock.name || stock.symbol}</div>
                        <div class="text-[11px] text-gray-500">${stock.symbol}</div>
                    </div>
                    <button 
                        class="delete-btn text-gray-600 hover:text-red-400 p-1 rounded-lg hover:bg-red-500/10"
                        onclick="event.stopPropagation(); removeStock(${index})"
                        title="移除"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                `;
                listEl.appendChild(btn);
            });
        }

        function addStock() {
            const input = document.getElementById('stock-input');
            let symbol = input.value.trim().toUpperCase();

            if (!symbol) {
                input.focus();
                return;
            }

            if (!/^[A-Z0-9.\-]+$/.test(symbol)) {
                alert('請輸入有效的股票代碼');
                return;
            }

            if (watchlist.some(s => s.symbol === symbol)) {
                alert(`${symbol} 已經在清單中了`);
                input.value = '';
                return;
            }

            const color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
            watchlist.push({ symbol, name: symbol, color });
            saveWatchlist();
            renderWatchlist();
            input.value = '';
            loadStock(symbol);
        }

        function removeStock(index) {
            const removed = watchlist[index];
            if (!confirm(`確定要移除 ${removed.symbol} 嗎？`)) return;

            watchlist.splice(index, 1);
            saveWatchlist();
            renderWatchlist();

            if (currentSymbol === removed.symbol) {
                currentSymbol = null;
                document.getElementById('stock-symbol-title').textContent = '—';
                document.getElementById('stock-name').textContent = '選擇或新增股票以查看詳情';
                document.getElementById('current-price').textContent = '—';
                document.getElementById('price-change').textContent = '—';
                document.getElementById('last-update').textContent = '—';
                document.getElementById('empty-state').style.display = 'flex';
                candlestickSeries.setData([]);
            }
        }

        // ========== 資料來源 ==========
        // 1. Finnhub 拿即時報價
        async function fetchQuote(symbol) {
            if (!FINNHUB_API_KEY || FINNHUB_API_KEY.trim() === '') {
                throw new Error('MISSING_API_KEY');
            }
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
            if (!res.ok) throw new Error('QUOTE_FAILED');
            const data = await res.json();
            if (data.c === 0 || data.c === null) throw new Error('NO_QUOTE_DATA');
            return {
                latestPrice: data.c.toFixed(2),
                change: data.d !== null ? data.d.toFixed(2) : '0.00',
                changePercent: data.dp !== null ? data.dp.toFixed(2) + '%' : '0.00%',
                isUp: (data.d ?? 0) >= 0
            };
        }

        // 2. 透過 Cloudflare Worker 拿 Yahoo K線
        async function fetchCandles(symbol) {
            const url = `${WORKER_URL}/?symbol=${encodeURIComponent(symbol)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('CANDLE_FAILED');
            const json = await res.json();

            const result = json.chart?.result?.[0];
            if (!result || !result.timestamp) throw new Error('NO_CANDLE_DATA');

            const quotes = result.indicators.quote[0];
            const timestamps = result.timestamp;

            const chartData = [];
            for (let i = 0; i < timestamps.length; i++) {
                if (quotes.open[i] == null || quotes.high[i] == null || 
                    quotes.low[i] == null || quotes.close[i] == null) continue;

                chartData.push({
                    time: new Date(timestamps[i] * 1000).toISOString().split('T')[0],
                    open: quotes.open[i],
                    high: quotes.high[i],
                    low: quotes.low[i],
                    close: quotes.close[i]
                });
            }
            return chartData;
        }

        let currentSymbol = null;

        async function loadStock(symbol) {
            currentSymbol = symbol;

            document.querySelectorAll('.stock-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.symbol === symbol);
            });

            document.getElementById('stock-symbol-title').textContent = symbol;
            document.getElementById('stock-name').textContent = '載入中...';
            document.getElementById('loading-badge').classList.remove('hidden');
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('current-price').textContent = '—';
            document.getElementById('price-change').textContent = '—';
            document.getElementById('price-change').className = 'text-base md:text-lg font-semibold px-2.5 py-1 rounded-lg bg-white/5';
            document.getElementById('current-price').className = 'text-4xl md:text-5xl font-extrabold text-white tracking-tight';

            try {
                const [quote, chartData] = await Promise.all([
                    fetchQuote(symbol),
                    fetchCandles(symbol)
                ]);

                // 更新價格
                document.getElementById('current-price').textContent = quote.latestPrice;
                const changeEl = document.getElementById('price-change');
                const sign = quote.isUp ? '+' : '';
                changeEl.textContent = `${sign}${quote.change} (${sign}${quote.changePercent})`;
                
                if (quote.isUp) {
                    changeEl.classList.add('price-up');
                    document.getElementById('current-price').classList.add('price-up');
                } else {
                    changeEl.classList.add('price-down');
                    document.getElementById('current-price').classList.add('price-down');
                }

                const stockItem = watchlist.find(s => s.symbol === symbol);
                document.getElementById('stock-name').textContent = stockItem?.name || symbol;

                // 更新K線
                if (chartData.length > 0) {
                    candlestickSeries.setData(chartData);
                    chart.timeScale().fitContent();
                }

                const now = new Date();
                document.getElementById('last-update').textContent = 
                    `最後更新：${now.toLocaleString('zh-TW', { hour12: false })}`;

            } catch (error) {
                console.error(error);
                
                if (error.message === 'MISSING_API_KEY') {
                    document.getElementById('stock-symbol-title').textContent = '請設定 API Key';
                    document.getElementById('stock-name').textContent = '請在程式碼填入 Finnhub API Key（報價用）';
                    document.getElementById('price-change').textContent = '未設定金鑰';
                    alert('請先在程式碼中填入 Finnhub API Key！\n（K線已透過 Worker 取得）');
                } else if (error.message === 'NO_QUOTE_DATA' || error.message === 'QUOTE_FAILED') {
                    document.getElementById('stock-name').textContent = '找不到報價資料';
                    document.getElementById('price-change').textContent = '報價失敗';
                } else if (error.message === 'NO_CANDLE_DATA' || error.message === 'CANDLE_FAILED') {
                    document.getElementById('stock-name').textContent = 'K線資料取得失敗';
                    document.getElementById('price-change').textContent = 'K線失敗';
                } else {
                    document.getElementById('stock-name').textContent = '載入失敗，請稍後再試';
                    document.getElementById('price-change').textContent = '錯誤';
                }
            } finally {
                document.getElementById('loading-badge').classList.add('hidden');
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('show');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderWatchlist();
            if (watchlist.length > 0) {
                loadStock(watchlist[0].symbol);
            }
        });
    </script>
</body>
</html>
