<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { background-color: #121212; color: #e0e0e0; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 左側邊欄：自選股清單 -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800">
            <h1 class="text-xl font-bold text-white">自選股清單</h1>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="stock-list">
            <button onclick="loadStock('AMD')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">超微 (AMD)</button>
            <button onclick="loadStock('META')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">Meta (META)</button>
            <button onclick="loadStock('NVDA')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">輝達 (NVDA)</button>
            <button onclick="loadStock('TSM')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">台積電 ADR (TSM)</button>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="flex-1 flex flex-col p-6 overflow-y-auto">
        <header class="flex justify-between items-end mb-6 bg-gray-900 p-6 rounded-lg border border-gray-800">
            <div>
                <h2 id="stock-symbol-title" class="text-3xl font-bold text-white tracking-wider">載入中...</h2>
                <p id="stock-currency" class="text-gray-400 text-sm mt-1">資料來源: Finnhub</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-400 mb-1">最新成交價</p>
                <div class="flex items-baseline gap-3">
                    <span id="current-price" class="text-4xl font-bold text-white">--</span>
                    <span id="price-change" class="text-lg font-medium">--</span>
                </div>
            </div>
        </header>

        <div class="flex-1 bg-gray-900 rounded-lg border border-gray-800 p-4 min-h-[400px]">
            <div id="chart-container" class="w-full h-full"></div>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚠️ 請在這裡填入你的 Finnhub API Key ⚠️
        // ==========================================
        const FINNHUB_API_KEY = '請替換成你的_API_KEY'; 

        // 1. 初始化圖表
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { textColor: '#d1d4dc', backgroundColor: 'transparent' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { borderColor: '#2B2B43' }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef5350', downColor: '#26a69a',
            borderVisible: false, wickUpColor: '#ef5350', wickDownColor: '#26a69a',
        });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // 2. 抓取 Finnhub 資料
        async function fetchFinnhubData(symbol) {
            if (FINNHUB_API_KEY === 'da3fmchr01qual4pud1gda3fmchr01qual4pud20') {
                throw new Error("請先在程式碼中設定 FINNHUB_API_KEY");
            }

            // 計算時間範圍 (抓取近半年)
            const to = Math.floor(Date.now() / 1000);
            const from = to - (180 * 24 * 60 * 60); 

            // 同時發出兩個請求：即時報價 (quote) 與歷史 K 線 (candle)
            const [quoteRes, candleRes] = await Promise.all([
                fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`),
                fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=D&from=${from}&to=${to}&token=${FINNHUB_API_KEY}`)
            ]);

            if (!quoteRes.ok || !candleRes.ok) throw new Error('API 請求失敗');

            const quoteData = await quoteRes.json();
            const candleData = await candleRes.json();

            // 整理報價
            const summaryData = {
                symbol: symbol,
                latestPrice: quoteData.c.toFixed(2),
                change: quoteData.d.toFixed(2),
                changePercent: quoteData.dp.toFixed(2) + '%',
                isUp: quoteData.d >= 0
            };

            // 整理 K 線
            const chartData = [];
            if (candleData.s === 'ok') {
                for (let i = 0; i < candleData.t.length; i++) {
                    const date = new Date(candleData.t[i] * 1000);
                    chartData.push({
                        time: date.toISOString().split('T')[0],
                        open: candleData.o[i],
                        high: candleData.h[i],
                        low: candleData.l[i],
                        close: candleData.c[i],
                    });
                }
            }

            return { summaryData, chartData };
        }

        // 3. 更新畫面
        async function loadStock(symbol) {
            document.getElementById('stock-symbol-title').innerText = '資料載入中...';
            
            try {
                const { summaryData, chartData } = await fetchFinnhubData(symbol);

                document.getElementById('stock-symbol-title').innerText = summaryData.symbol;
                document.getElementById('current-price').innerText = summaryData.latestPrice;
                
                const changeEl = document.getElementById('price-change');
                const sign = summaryData.isUp ? '+' : '';
                changeEl.innerText = `${sign}${summaryData.change} (${sign}${summaryData.changePercent})`;
                
                if (summaryData.isUp) {
                    changeEl.className = "text-lg font-medium text-red-500";
                    document.getElementById('current-price').className = "text-4xl font-bold text-red-500";
                } else {
                    changeEl.className = "text-lg font-medium text-green-500";
                    document.getElementById('current-price').className = "text-4xl font-bold text-green-500";
                }

                candlestickSeries.setData(chartData);
                chart.timeScale().fitContent();

            } catch (error) {
                console.error(error);
                document.getElementById('stock-symbol-title').innerText = '載入失敗';
                if (error.message.includes("FINNHUB_API_KEY")) {
                    alert(error.message);
                } else {
                    alert('無法取得資料，請確認 API Key 是否正確，或稍後再試。');
                }
            }
        }

        // 預設載入 AMD
        window.addEventListener('DOMContentLoaded', () => {
            loadStock('AMD'); 
        });
    </script>
</body>
</html>
