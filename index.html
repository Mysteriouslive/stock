<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    <!-- 引入 Tailwind CSS 框架來快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 TradingView 圖表套件 -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 隱藏滾動條但保留滾動功能 */
        ::-webkit-scrollbar { display: none; }
        body { background-color: #121212; color: #e0e0e0; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 左側邊欄：自選股清單 -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800">
            <h1 class="text-xl font-bold text-white">自選股清單</h1>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="stock-list">
            <!-- 股票切換按鈕 -->
            <button onclick="loadStock('2330.TW')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">台積電 (2330.TW)</button>
            <button onclick="loadStock('AMD')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">超微 (AMD)</button>
            <button onclick="loadStock('META')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">Meta (META)</button>
            <button onclick="loadStock('NVDA')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">輝達 (NVDA)</button>
            <button onclick="loadStock('0050.TW')" class="w-full text-left px-4 py-3 mb-2 rounded hover:bg-gray-800 transition">元大台灣50 (0050)</button>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="flex-1 flex flex-col p-6 overflow-y-auto">
        
        <!-- 頂部數據卡片 -->
        <header class="flex justify-between items-end mb-6 bg-gray-900 p-6 rounded-lg border border-gray-800">
            <div>
                <h2 id="stock-symbol-title" class="text-3xl font-bold text-white tracking-wider">載入中...</h2>
                <p id="stock-currency" class="text-gray-400 text-sm mt-1">--</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-400 mb-1">最新成交價</p>
                <div class="flex items-baseline gap-3">
                    <span id="current-price" class="text-4xl font-bold text-white">--</span>
                    <span id="price-change" class="text-lg font-medium">--</span>
                </div>
            </div>
        </header>

        <!-- K 線圖表區塊 -->
        <div class="flex-1 bg-gray-900 rounded-lg border border-gray-800 p-4 min-h-[400px]">
            <div id="chart-container" class="w-full h-full"></div>
        </div>

    </main>

    <!-- 腳本邏輯區 -->
    <script>
        // === 1. 初始化 TradingView 圖表 ===
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { textColor: '#d1d4dc', backgroundColor: 'transparent' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { borderColor: '#2B2B43' }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef5350',      // 台灣習慣：紅漲 (如要美股習慣可改為綠色 #26a69a)
            downColor: '#26a69a',    // 台灣習慣：綠跌 (如要美股習慣可改為紅色 #ef5350)
            borderVisible: false,
            wickUpColor: '#ef5350',
            wickDownColor: '#26a69a',
        });

        // 確保圖表隨視窗縮放
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // === 2. 抓取 Yahoo Finance API 邏輯 ===
        async function fetchYahooStockData(symbol) {
            const range = '3mo'; // 預設抓取近三個月資料
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=${range}`;
            // 使用 allorigins 作為 CORS Proxy 繞過瀏覽器限制
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`;

            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('API 請求失敗');
            
            const json = await response.json();
            const result = json.chart.result[0];
            const meta = result.meta;
            const timestamps = result.timestamp;
            const quote = result.indicators.quote[0];

            // 整理最新報價
            const latestPrice = meta.regularMarketPrice;
            const prevClose = meta.chartPreviousClose || meta.previousClose;
            const priceChange = latestPrice - prevClose;
            const changePercent = (priceChange / prevClose) * 100;

            const summaryData = {
                symbol: meta.symbol,
                currency: meta.currency,
                latestPrice: latestPrice.toFixed(2),
                change: priceChange.toFixed(2),
                changePercent: changePercent.toFixed(2) + '%',
                isUp: priceChange >= 0
            };

            // 整理 K 線資料
            const candleData = [];
            for (let i = 0; i < timestamps.length; i++) {
                if (quote.open[i] !== null && quote.close[i] !== null) {
                    const date = new Date(timestamps[i] * 1000);
                    candleData.push({
                        time: date.toISOString().split('T')[0],
                        open: Number(quote.open[i].toFixed(2)),
                        high: Number(quote.high[i].toFixed(2)),
                        low: Number(quote.low[i].toFixed(2)),
                        close: Number(quote.close[i].toFixed(2)),
                    });
                }
            }
            return { summaryData, candleData };
        }

        // === 3. 更新畫面邏輯 ===
        async function loadStock(symbol) {
            document.getElementById('stock-symbol-title').innerText = '資料載入中...';
            
            try {
                const { summaryData, candleData } = await fetchYahooStockData(symbol);

                // 更新文字與價格
                document.getElementById('stock-symbol-title').innerText = summaryData.symbol;
                document.getElementById('stock-currency').innerText = `幣別: ${summaryData.currency}`;
                document.getElementById('current-price').innerText = summaryData.latestPrice;
                
                const changeEl = document.getElementById('price-change');
                const sign = summaryData.isUp ? '+' : '';
                changeEl.innerText = `${sign}${summaryData.change} (${sign}${summaryData.changePercent})`;
                
                // 設定漲跌顏色 (台灣習慣紅漲綠跌)
                if (summaryData.isUp) {
                    changeEl.className = "text-lg font-medium text-red-500";
                    document.getElementById('current-price').className = "text-4xl font-bold text-red-500";
                } else {
                    changeEl.className = "text-lg font-medium text-green-500";
                    document.getElementById('current-price').className = "text-4xl font-bold text-green-500";
                }

                // 更新圖表資料
                candlestickSeries.setData(candleData);
                chart.timeScale().fitContent(); // 自動縮放視圖

            } catch (error) {
                console.error(error);
                document.getElementById('stock-symbol-title').innerText = '載入失敗';
                alert('無法取得資料，請檢查網路狀態或重試。');
            }
        }

        // === 4. 網頁載入時，預設顯示第一檔股票 ===
        window.addEventListener('DOMContentLoaded', () => {
            loadStock('AMD'); 
        });
    </script>
</body>
</html>
