<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    <!-- Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TradingView K線圖套件 -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 隱藏滾動條，保持畫面極簡 */
        ::-webkit-scrollbar { display: none; }
        /* 設定極致深色背景 */
        body { background-color: #050505; color: #e0e0e0; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 左側邊欄：自選股清單 (毛玻璃質感) -->
    <aside class="w-64 bg-black/60 backdrop-blur-xl border-r border-white/5 flex flex-col shadow-2xl z-10">
        <div class="p-6 border-b border-white/5">
            <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500 tracking-wider">
                自選股清單
            </h1>
        </div>
        <div class="flex-1 overflow-y-auto p-3" id="stock-list">
            <!-- 股票切換按鈕：加入平滑懸停效果 -->
            <button onclick="loadStock('AMD')" class="w-full text-left px-4 py-3 mb-2 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 hover:shadow-lg transition-all duration-300">超微 (AMD)</button>
            <button onclick="loadStock('META')" class="w-full text-left px-4 py-3 mb-2 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 hover:shadow-lg transition-all duration-300">Meta (META)</button>
            <button onclick="loadStock('NVDA')" class="w-full text-left px-4 py-3 mb-2 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 hover:shadow-lg transition-all duration-300">輝達 (NVDA)</button>
            <button onclick="loadStock('TSM')" class="w-full text-left px-4 py-3 mb-2 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 hover:shadow-lg transition-all duration-300">台積電 ADR (TSM)</button>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="flex-1 flex flex-col p-6 overflow-y-auto relative">
        
        <!-- 背景裝飾光暈 -->
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[120px] pointer-events-none"></div>

        <!-- 頂部數據卡片 -->
        <header class="flex justify-between items-end mb-6 bg-gray-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 via-purple-600 to-transparent opacity-50"></div>
            
            <div class="z-10">
                <h2 id="stock-symbol-title" class="text-4xl font-black text-white tracking-widest drop-shadow-md">載入中...</h2>
                <p id="stock-currency" class="text-gray-500 text-sm mt-2 font-medium">資料來源: Finnhub</p>
            </div>
            <div class="text-right z-10">
                <p class="text-sm text-gray-500 mb-2 font-medium tracking-wide">最新成交價</p>
                <div class="flex items-baseline gap-4">
                    <span id="current-price" class="text-5xl font-extrabold text-white drop-shadow-lg">--</span>
                    <span id="price-change" class="text-xl font-bold bg-white/5 px-3 py-1 rounded-lg backdrop-blur-md">--</span>
                </div>
            </div>
        </header>

        <!-- K 線圖表區塊 -->
        <div class="flex-1 bg-gray-900/30 backdrop-blur-sm rounded-2xl border border-white/5 p-4 min-h-[400px] shadow-2xl relative z-10">
            <div id="chart-container" class="w-full h-full"></div>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚠️ 請在這裡填入你註冊取得的 Finnhub API Key ⚠️
        // ==========================================
        const FINNHUB_API_KEY = 'da3fmchr01qual4pud1gda3fmchr01qual4pud20'; 

        // 1. 初始化 TradingView 圖表外觀 (配合深色主題)
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { 
                textColor: '#9ca3af', 
                backgroundColor: 'transparent' // 透明背景以透出底下的毛玻璃
            },
            grid: { 
                vertLines: { color: 'rgba(255, 255, 255, 0.05)' }, 
                horzLines: { color: 'rgba(255, 255, 255, 0.05)' } 
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { borderColor: 'rgba(255, 255, 255, 0.1)' }
        });

        // 顏色設定：台灣習慣紅漲綠跌 (若偏好美股綠漲紅跌可自行對調顏色代碼)
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef5350',      
            downColor: '#26a69a',    
            borderVisible: false, 
            wickUpColor: '#ef5350', 
            wickDownColor: '#26a69a',
        });

        // 讓圖表跟隨視窗自動縮放
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // 2. 呼叫 Finnhub API
        async function fetchFinnhubData(symbol) {
            if (FINNHUB_API_KEY === '請替換成你的_API_KEY') {
                throw new Error("請先在程式碼中設定 FINNHUB_API_KEY");
            }

            const to = Math.floor(Date.now() / 1000);
            const from = to - (180 * 24 * 60 * 60); // 抓取近半年 K 線

            const [quoteRes, candleRes] = await Promise.all([
                fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`),
                fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=D&from=${from}&to=${to}&token=${FINNHUB_API_KEY}`)
            ]);

            if (!quoteRes.ok || !candleRes.ok) throw new Error('API 請求失敗');

            const quoteData = await quoteRes.json();
            const candleData = await candleRes.json();

            const summaryData = {
                symbol: symbol,
                latestPrice: quoteData.c.toFixed(2),
                change: quoteData.d.toFixed(2),
                changePercent: quoteData.dp.toFixed(2) + '%',
                isUp: quoteData.d >= 0
            };

            const chartData = [];
            if (candleData.s === 'ok') {
                for (let i = 0; i < candleData.t.length; i++) {
                    const date = new Date(candleData.t[i] * 1000);
                    chartData.push({
                        time: date.toISOString().split('T')[0],
                        open: candleData.o[i],
                        high: candleData.h[i],
                        low: candleData.l[i],
                        close: candleData.c[i],
                    });
                }
            }

            return { summaryData, chartData };
        }

        // 3. 將資料更新至畫面上
        async function loadStock(symbol) {
            document.getElementById('stock-symbol-title').innerText = '資料載入中...';
            
            try {
                const { summaryData, chartData } = await fetchFinnhubData(symbol);

                document.getElementById('stock-symbol-title').innerText = summaryData.symbol;
                document.getElementById('current-price').innerText = summaryData.latestPrice;
                
                const changeEl = document.getElementById('price-change');
                const sign = summaryData.isUp ? '+' : '';
                changeEl.innerText = `${sign}${summaryData.change} (${sign}${summaryData.changePercent})`;
                
                // 設定漲跌顏色 (保留排版的 class，僅抽換文字顏色)
                const baseChangeClass = "text-xl font-bold bg-white/5 px-3 py-1 rounded-lg backdrop-blur-md ";
                if (summaryData.isUp) {
                    changeEl.className = baseChangeClass + "text-red-500";
                    document.getElementById('current-price').className = "text-5xl font-extrabold drop-shadow-lg text-red-500";
                } else {
                    changeEl.className = baseChangeClass + "text-green-500";
                    document.getElementById('current-price').className = "text-5xl font-extrabold drop-shadow-lg text-green-500";
                }

                candlestickSeries.setData(chartData);
                chart.timeScale().fitContent();

            } catch (error) {
                console.error(error);
                document.getElementById('stock-symbol-title').innerText = '載入失敗';
                if (error.message.includes("FINNHUB_API_KEY")) {
                    alert("別忘了填寫你的 API Key 喔！");
                }
            }
        }

        // 網頁開啟時預設載入 AMD
        window.addEventListener('DOMContentLoaded', () => {
            loadStock('AMD'); 
        });
    </script>
</body>
</html>
