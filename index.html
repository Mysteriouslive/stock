<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        body {
            background: #030303;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        }
        
        .glass {
            background: rgba(12, 12, 14, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .stock-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stock-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(2px);
        }
        .stock-btn.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.08));
            border-left: 3px solid #3b82f6;
            color: #fff;
        }
        
        .price-up { color: #ef4444; }
        .price-down { color: #10b981; }
        
        .loading-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* 手機側邊欄 */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                height: 100%;
                z-index: 50;
                transition: left 0.3s ease;
            }
            #sidebar.open { left: 0; }
            #overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 40;
            }
            #overlay.show { display: block; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex">

    <!-- 手機遮罩 -->
    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- 左側邊欄 -->
    <aside id="sidebar" class="w-64 glass flex flex-col shrink-0 border-r border-white/5 z-20">
        <div class="p-5 border-b border-white/5 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
                    自選股清單
                </h1>
                <p class="text-[11px] text-gray-500 mt-0.5">Personal Watchlist</p>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="stock-list">
            <button onclick="loadStock('AMD')" data-symbol="AMD" class="stock-btn w-full text-left px-4 py-3 rounded-xl text-gray-400 flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center text-xs font-bold">AMD</span>
                <div>
                    <div class="font-medium text-sm">超微</div>
                    <div class="text-[11px] text-gray-500">AMD</div>
                </div>
            </button>
            <button onclick="loadStock('META')" data-symbol="META" class="stock-btn w-full text-left px-4 py-3 rounded-xl text-gray-400 flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs font-bold">META</span>
                <div>
                    <div class="font-medium text-sm">Meta</div>
                    <div class="text-[11px] text-gray-500">META</div>
                </div>
            </button>
            <button onclick="loadStock('NVDA')" data-symbol="NVDA" class="stock-btn w-full text-left px-4 py-3 rounded-xl text-gray-400 flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-green-500/20 text-green-400 flex items-center justify-center text-xs font-bold">NVDA</span>
                <div>
                    <div class="font-medium text-sm">輝達</div>
                    <div class="text-[11px] text-gray-500">NVDA</div>
                </div>
            </button>
            <button onclick="loadStock('TSM')" data-symbol="TSM" class="stock-btn w-full text-left px-4 py-3 rounded-xl text-gray-400 flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold">TSM</span>
                <div>
                    <div class="font-medium text-sm">台積電 ADR</div>
                    <div class="text-[11px] text-gray-500">TSM</div>
                </div>
            </button>
        </div>

        <div class="p-4 border-t border-white/5 text-[11px] text-gray-500">
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                資料來源 Finnhub
            </div>
        </div>
    </aside>

    <!-- 右側主內容 -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- 背景光暈 -->
        <div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none"></div>
        <div class="absolute bottom-[-15%] left-[-5%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

        <!-- 頂部工具列（手機用） -->
        <div class="md:hidden flex items-center gap-3 p-4 border-b border-white/5">
            <button onclick="toggleSidebar()" class="p-2 rounded-lg glass text-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="font-semibold tracking-wide">股票觀測站</span>
        </div>

        <div class="flex-1 flex flex-col p-4 md:p-6 overflow-y-auto relative z-10">
            <!-- 頂部數據卡片 -->
            <header class="glass rounded-2xl p-5 md:p-6 mb-5 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-blue-500 via-purple-500 to-transparent opacity-60"></div>
                
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="stock-symbol-title" class="text-3xl md:text-4xl font-black tracking-wider text-white">
                                —
                            </h2>
                            <span id="loading-badge" class="hidden text-[11px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 loading-pulse">
                                載入中
                            </span>
                        </div>
                        <p id="stock-name" class="text-gray-400 text-sm mt-1">選擇股票以查看詳情</p>
                        <p id="last-update" class="text-[11px] text-gray-600 mt-2">—</p>
                    </div>

                    <div class="text-left md:text-right">
                        <p class="text-xs text-gray-500 mb-1 tracking-wide">最新成交價</p>
                        <div class="flex items-baseline gap-3 md:justify-end">
                            <span id="current-price" class="text-4xl md:text-5xl font-extrabold text-white tracking-tight">—</span>
                            <span id="price-change" class="text-base md:text-lg font-semibold px-2.5 py-1 rounded-lg bg-white/5">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- K 線圖表 -->
            <div class="flex-1 glass rounded-2xl p-3 md:p-4 min-h-[380px] relative">
                <div id="chart-container" class="w-full h-full min-h-[360px]"></div>
                
                <!-- 空狀態提示 -->
                <div id="empty-state" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="text-center text-gray-500">
                        <div class="text-4xl mb-3 opacity-30">📈</div>
                        <p class="text-sm">選擇左側股票開始觀測</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚠️ 請在此填入你的 Finnhub API Key
        // ==========================================
        const FINNHUB_API_KEY = 'da3fmchr01qual4pud1gda3fmchr01qual4pud20';

        // 股票中文名稱對照
        const STOCK_NAMES = {
            'AMD': '超微 (Advanced Micro Devices)',
            'META': 'Meta Platforms',
            'NVDA': '輝達 (NVIDIA)',
            'TSM': '台積電 ADR (TSMC)'
        };

        // 初始化圖表
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                textColor: '#9ca3af',
                background: { type: 'solid', color: 'transparent' },
                fontSize: 12
            },
            grid: {
                vertLines: { color: 'rgba(255,255,255,0.04)' },
                horzLines: { color: 'rgba(255,255,255,0.04)' }
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: 'rgba(255,255,255,0.2)', width: 1, style: 2 },
                horzLine: { color: 'rgba(255,255,255,0.2)', width: 1, style: 2 }
            },
            timeScale: {
                borderColor: 'rgba(255,255,255,0.08)',
                timeVisible: true
            },
            rightPriceScale: {
                borderColor: 'rgba(255,255,255,0.08)'
            }
        });

        // 台灣習慣：紅漲綠跌
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef4444',
            downColor: '#10b981',
            borderVisible: false,
            wickUpColor: '#ef4444',
            wickDownColor: '#10b981'
        });

        // 自動調整大小
        const resizeObserver = new ResizeObserver(() => {
            chart.applyOptions({
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight
            });
        });
        resizeObserver.observe(chartContainer);

        // 手機側邊欄切換
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // 取得資料
        async function fetchFinnhubData(symbol) {
            if (!FINNHUB_API_KEY || FINNHUB_API_KEY.trim() === '') {
                throw new Error('MISSING_API_KEY');
            }

            const to = Math.floor(Date.now() / 1000);
            const from = to - (180 * 24 * 60 * 60); // 近 180 天

            const [quoteRes, candleRes] = await Promise.all([
                fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`),
                fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=D&from=${from}&to=${to}&token=${FINNHUB_API_KEY}`)
            ]);

            if (!quoteRes.ok || !candleRes.ok) {
                throw new Error('API_REQUEST_FAILED');
            }

            const quoteData = await quoteRes.json();
            const candleData = await candleRes.json();

            if (quoteData.c === 0 || quoteData.c === null) {
                throw new Error('NO_QUOTE_DATA');
            }

            const summaryData = {
                symbol,
                latestPrice: quoteData.c.toFixed(2),
                change: quoteData.d !== null ? quoteData.d.toFixed(2) : '0.00',
                changePercent: quoteData.dp !== null ? quoteData.dp.toFixed(2) + '%' : '0.00%',
                isUp: (quoteData.d ?? 0) >= 0
            };

            const chartData = [];
            if (candleData.s === 'ok' && candleData.t?.length) {
                for (let i = 0; i < candleData.t.length; i++) {
                    chartData.push({
                        time: new Date(candleData.t[i] * 1000).toISOString().split('T')[0],
                        open: candleData.o[i],
                        high: candleData.h[i],
                        low: candleData.l[i],
                        close: candleData.c[i]
                    });
                }
            }

            return { summaryData, chartData };
        }

        // 載入股票
        let currentSymbol = null;

        async function loadStock(symbol) {
            if (currentSymbol === symbol) return;
            currentSymbol = symbol;

            // 更新按鈕選中狀態
            document.querySelectorAll('.stock-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.symbol === symbol);
            });

            // 顯示載入狀態
            document.getElementById('stock-symbol-title').textContent = symbol;
            document.getElementById('stock-name').textContent = STOCK_NAMES[symbol] || symbol;
            document.getElementById('loading-badge').classList.remove('hidden');
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('current-price').textContent = '—';
            document.getElementById('price-change').textContent = '—';
            document.getElementById('price-change').className = 'text-base md:text-lg font-semibold px-2.5 py-1 rounded-lg bg-white/5';

            try {
                const { summaryData, chartData } = await fetchFinnhubData(symbol);

                document.getElementById('current-price').textContent = summaryData.latestPrice;
                
                const changeEl = document.getElementById('price-change');
                const sign = summaryData.isUp ? '+' : '';
                changeEl.textContent = `${sign}${summaryData.change} (${sign}${summaryData.changePercent})`;
                
                if (summaryData.isUp) {
                    changeEl.classList.add('price-up');
                    document.getElementById('current-price').className = 'text-4xl md:text-5xl font-extrabold tracking-tight price-up';
                } else {
                    changeEl.classList.add('price-down');
                    document.getElementById('current-price').className = 'text-4xl md:text-5xl font-extrabold tracking-tight price-down';
                }

                if (chartData.length > 0) {
                    candlestickSeries.setData(chartData);
                    chart.timeScale().fitContent();
                }

                const now = new Date();
                document.getElementById('last-update').textContent = 
                    `最後更新：${now.toLocaleString('zh-TW', { hour12: false })}`;

            } catch (error) {
                console.error(error);
                document.getElementById('stock-symbol-title').textContent = '載入失敗';
                document.getElementById('stock-name').textContent = '';
                
                if (error.message === 'MISSING_API_KEY') {
                    alert('請先在程式碼中填入你的 Finnhub API Key！\n\n可至 https://finnhub.io 免費註冊取得。');
                } else {
                    document.getElementById('current-price').textContent = '—';
                    document.getElementById('price-change').textContent = '資料取得失敗';
                }
            } finally {
                document.getElementById('loading-badge').classList.add('hidden');
            }

            // 手機自動關閉側邊欄
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('show');
            }
        }

        // 預設載入
        window.addEventListener('DOMContentLoaded', () => {
            loadStock('AMD');
        });
    </script>
</body>
</html>
