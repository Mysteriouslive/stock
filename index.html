<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股票觀測站</title>
    
    <!-- 引入 Tailwind CSS 用於快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind 自訂設定 (深色財經主題) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#131722',
                        card: '#1e222d',
                        up: '#26a69a',   // 漲 (綠色)
                        down: '#ef5350', // 跌 (紅色)
                    }
                }
            }
        }
    </script>
    <style>
        /* 確保圖表容器能正確響應大小 */
        #chart-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #131722; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
    </style>
</head>
<body class="bg-dark text-gray-200 font-sans h-screen flex overflow-hidden">

    <!-- 左側邊欄：自選股清單 -->
    <aside class="w-64 bg-card border-r border-gray-800 flex flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-up"></i>
                StockDash
            </h1>
        </div>
        
        <div class="p-4">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">我的自選股</h2>
            <ul id="watchlist" class="space-y-2">
                <!-- 自選股項目將由 JS 動態生成 -->
            </ul>
        </div>
    </aside>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- 頂部導覽列 -->
        <header class="h-16 bg-card border-b border-gray-800 flex items-center justify-between px-6">
            <div class="flex items-center bg-dark rounded-md px-3 py-1.5 w-64 border border-gray-700 focus-within:border-gray-500 transition-colors">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                <input type="text" placeholder="搜尋股票代號..." class="bg-transparent border-none outline-none text-sm text-white w-full placeholder-gray-500">
            </div>
            
            <div class="flex items-center gap-4">
                <button class="text-gray-400 hover:text-white transition-colors"><i class="fa-regular fa-bell"></i></button>
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold text-white">
                    U
                </div>
            </div>
        </header>

        <!-- 儀表板內容 -->
        <div class="flex-1 overflow-y-auto p-6">
            
            <!-- 標題與關鍵數據卡片 -->
            <div class="mb-6">
                <h2 id="current-stock-name" class="text-3xl font-bold text-white mb-4">Apple Inc. (AAPL)</h2>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- 卡片 1: 最新價格 -->
                    <div class="bg-card p-4 rounded-lg border border-gray-800">
                        <p class="text-sm text-gray-400 mb-1">最新成交價</p>
                        <div class="flex items-baseline gap-2">
                            <span id="price-current" class="text-2xl font-bold text-white">$175.43</span>
                            <span id="price-change" class="text-sm font-medium text-up"><i class="fa-solid fa-arrow-trend-up mr-1"></i>+1.24%</span>
                        </div>
                    </div>
                    
                    <!-- 卡片 2: 今日開盤 -->
                    <div class="bg-card p-4 rounded-lg border border-gray-800">
                        <p class="text-sm text-gray-400 mb-1">今日開盤</p>
                        <span id="price-open" class="text-xl font-semibold text-gray-200">$173.10</span>
                    </div>

                    <!-- 卡片 3: 今日最高 -->
                    <div class="bg-card p-4 rounded-lg border border-gray-800">
                        <p class="text-sm text-gray-400 mb-1">今日最高</p>
                        <span id="price-high" class="text-xl font-semibold text-gray-200">$176.15</span>
                    </div>

                    <!-- 卡片 4: 成交量 -->
                    <div class="bg-card p-4 rounded-lg border border-gray-800">
                        <p class="text-sm text-gray-400 mb-1">成交量</p>
                        <span class="text-xl font-semibold text-gray-200">54.2M</span>
                    </div>
                </div>
            </div>

            <!-- 圖表區塊 -->
            <div class="bg-card rounded-lg border border-gray-800 p-4 h-[400px] mb-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-white">歷史走勢 (K線圖)</h3>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 text-xs rounded bg-gray-800 text-white hover:bg-gray-700 transition">1D</button>
                        <button class="px-3 py-1 text-xs rounded bg-blue-600 text-white transition">1W</button>
                        <button class="px-3 py-1 text-xs rounded bg-gray-800 text-white hover:bg-gray-700 transition">1M</button>
                    </div>
                </div>
                <div class="flex-1 w-full relative">
                    <!-- 圖表將會掛載在這裡 -->
                    <div id="chart-container"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- 1. 介面與假資料設定 ---
        const watchListStocks = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 175.43, change: 1.24 },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 238.82, change: -2.15 },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 450.05, change: 3.42 },
            { symbol: '2330.TW', name: '台積電', price: 820.00, change: 1.50 }
        ];

        // 渲染左側自選股清單
        const watchlistContainer = document.getElementById('watchlist');
        
        function renderWatchlist() {
            watchlistContainer.innerHTML = '';
            watchListStocks.forEach(stock => {
                const isUp = stock.change >= 0;
                const colorClass = isUp ? 'text-up' : 'text-down';
                const sign = isUp ? '+' : '';
                
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center p-2 hover:bg-gray-800 rounded cursor-pointer transition-colors';
                li.onclick = () => updateDashboard(stock); // 點擊切換股票
                
                li.innerHTML = `
                    <div>
                        <p class="font-bold text-white text-sm">${stock.symbol}</p>
                        <p class="text-xs text-gray-500">${stock.name}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-white text-sm">${stock.price.toFixed(2)}</p>
                        <p class="text-xs ${colorClass}">${sign}${stock.change}%</p>
                    </div>
                `;
                watchlistContainer.appendChild(li);
            });
        }

        // 更新上方數據卡片
        function updateDashboard(stock) {
            document.getElementById('current-stock-name').innerText = `${stock.name} (${stock.symbol})`;
            document.getElementById('price-current').innerText = `$${stock.price.toFixed(2)}`;
            
            const isUp = stock.change >= 0;
            const changeEl = document.getElementById('price-change');
            changeEl.className = `text-sm font-medium ${isUp ? 'text-up' : 'text-down'}`;
            changeEl.innerHTML = `<i class="fa-solid fa-arrow-trend-${isUp ? 'up' : 'down'} mr-1"></i>${isUp ? '+' : ''}${stock.change}%`;
            
            // 重新生成隨機圖表數據來模擬切換股票的效果
            candlestickSeries.setData(generateMockData(stock.price));
        }


        // --- 2. TradingView 圖表初始化 ---
        const chartProperties = {
            layout: {
                background: { type: 'solid', color: '#1e222d' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            timeScale: {
                borderColor: '#2B2B43',
            },
        };

        const domElement = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(domElement, chartProperties);

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        // 處理圖表響應式縮放
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== domElement) { return; }
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(domElement);


        // --- 3. 模擬 K 線數據產生器 (僅供視覺展示) ---
        function generateMockData(basePrice) {
            const data = [];
            let currentPrice = basePrice * 0.8; // 讓圖表呈現從低點往上走的趨勢
            let date = new Date('2025-01-01');

            for (let i = 0; i < 100; i++) {
                const volatility = basePrice * 0.02; // 2% 波動
                const open = currentPrice + (Math.random() - 0.5) * volatility;
                const close = open + (Math.random() - 0.5) * volatility * 2;
                const high = Math.max(open, close) + Math.random() * volatility;
                const low = Math.min(open, close) - Math.random() * volatility;

                data.push({
                    time: date.toISOString().split('T')[0],
                    open: parseFloat(open.toFixed(2)),
                    high: parseFloat(high.toFixed(2)),
                    low: parseFloat(low.toFixed(2)),
                    close: parseFloat(close.toFixed(2))
                });
                
                currentPrice = close;
                date.setDate(date.getDate() + 1);
                // 跳過週末
                if(date.getDay() === 0 || date.getDay() === 6) { date.setDate(date.getDate() + 2); }
            }
            return data;
        }

        // 初始化網頁
        renderWatchlist();
        updateDashboard(watchListStocks[0]); // 預設載入第一檔股票

        /* 
        ========================================================
        未來你要串接 API 時，只要在這個檔案內寫入以下類似的邏輯即可：
        
        async function fetchStockData(symbol) {
            const API_KEY = '你的_FINNHUB_KEY';
            const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
            const data = await response.json();
            
            // 拿到真實數據後，更新畫面
            document.getElementById('price-current').innerText = data.c;
            // ...
        }
        ========================================================
        */
    </script>
</body>
</html>
